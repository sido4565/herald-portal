<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Request Password Reset — Herald Portal</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body { min-height:100vh; display:grid; place-items:center; padding:24px; background:#0b1a33; }
    .reset-card { width:min(440px,100%); padding:32px; border-radius:16px; background:var(--card); }
    .reset-card h1 { margin-top:0; }
    .reset-card label { display:block; margin:14px 0 6px; font-weight:600; }
    .reset-card input,.reset-card select { width:100%; padding:12px; border:1px solid var(--border); border-radius:8px; background:var(--bg); color:var(--text); }
    #requestMsg { margin-top:16px; }
  </style>
</head>
<body>
  <main class="reset-card">
    <h1>Request a password reset</h1>
    <p>Submit the email address on your account. An admin will review your request and email a temporary password if approved.</p>
    <form id="resetRequestForm">
      <label for="accountType">Account type</label>
      <select id="accountType" name="accountType" required>
        <option value="student">Student</option>
        <option value="lecturer">Lecturer</option>
      </select>
      <label for="email">Account email</label>
      <input id="email" name="email" type="email" autocomplete="email" required />
      <button class="btn-primary" style="width:100%;margin-top:18px;" type="submit">Submit request</button>
    </form>
    <p id="requestMsg" class="msg" aria-live="polite"></p>
    <p class="hint"><a href="login.html">Student sign in</a> · <a href="lecturer-login.html">Lecturer sign in</a></p>
  </main>
  <script>
    const typeSelect = document.getElementById('accountType');
    const preferredType = new URLSearchParams(location.search).get('type');
    if (['student', 'lecturer'].includes(preferredType)) typeSelect.value = preferredType;
    document.getElementById('resetRequestForm').addEventListener('submit', async event => {
      event.preventDefault();
      const message = document.getElementById('requestMsg');
      const button = event.currentTarget.querySelector('button');
      message.className = 'msg';
      message.textContent = '';
      button.disabled = true;
      button.textContent = 'Submitting…';
      try {
        const response = await fetch('/api/password-reset-requests', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(Object.fromEntries(new FormData(event.currentTarget))),
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Request failed.');
        message.className = 'msg success';
        message.textContent = data.message;
        event.currentTarget.reset();
        if (['student', 'lecturer'].includes(preferredType)) typeSelect.value = preferredType;
      } catch (error) {
        message.className = 'msg error';
        message.textContent = error.message;
      } finally {
        button.disabled = false;
        button.textContent = 'Submit request';
      }
    });
  </script>
</body>
</html>
