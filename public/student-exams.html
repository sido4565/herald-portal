<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My Exams — Herald Portal</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body { background: #f7f6f2; font-family: 'DM Sans', sans-serif; }
    .container { max-width: 900px; margin: 40px auto; padding: 0 20px; }
    h1 { color: #10243a; margin-bottom: 24px; }
    .student-exam-card { display:flex;align-items:center;gap:18px;padding:18px 22px;margin-bottom:24px;background:#10243a;color:#fff;border-radius:12px;box-shadow:0 4px 12px rgba(16,36,58,.12) }
    .student-exam-card img { width:82px;height:104px;object-fit:cover;border:2px solid #d8b765;border-radius:7px;background:#fff }
    .student-exam-card p { margin:5px 0 0;color:#e2e8f0;font-size:13px }
    .exam-card {
      background: #fff; border: 1px solid #e6e9ed; border-radius: 12px;
      padding: 20px; margin-bottom: 16px;
      box-shadow: 0 4px 12px rgba(16,36,58,0.04);
      display: flex; justify-content: space-between; align-items: center; gap: 20px;
    }
    .exam-info h3 { margin: 0 0 4px; color: #10243a; font-size: 17px; }
    .exam-info .meta { color: #647386; font-size: 13px; margin: 0; }
    .exam-action { flex: 0 0 auto; }
    .btn-take {
      background: #10243a; color: #fff; padding: 10px 20px; border-radius: 8px;
      text-decoration: none; font-size: 13px; font-weight: 700;
      display: inline-block;
    }
    .btn-take:hover { background: #1d405e; }
    .btn-done {
      background: #eaf3ef; color: #2d6d59; padding: 10px 20px; border-radius: 8px;
      font-size: 13px; font-weight: 700; cursor: default;
    }
    .empty { color: #647386; text-align: center; padding: 40px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>My Exams</h1>
    <section class="student-exam-card" aria-label="Student exam card">
      <img id="examCardPhoto" alt="Student passport photo" />
      <div style="flex:1"><strong id="examCardName">Loading student details…</strong><p>Registration No: <span id="examCardReg"></span></p><p id="examCardCourse"></p><p id="examCardFeeStatus">Checking fee clearance…</p><a id="downloadExamCard" href="/api/student/exam-card/pdf" style="display:none;color:#fff;background:#b8860b;padding:8px 12px;border-radius:6px;font-size:12px;font-weight:700;text-decoration:none;">Download Exam Card</a></div>
    </section>
    <div id="examsList"><p class="empty">Loading...</p></div>
  </div>

  <script>
    fetch('/api/me', { credentials: 'same-origin' }).then(r => r.ok ? r.json() : Promise.reject(new Error('Please sign in to view your student exam card.'))).then(student => {
      document.getElementById('examCardName').textContent = student.name;
      document.getElementById('examCardReg').textContent = student.reg_no;
      document.getElementById('examCardCourse').textContent = student.course;
      if (student.passport_photo_key) document.getElementById('examCardPhoto').src = '/api/student/passport-photo';
      else document.getElementById('examCardName').textContent = 'Upload your passport photo from the dashboard to activate your exam card.';
    }).catch(error => { document.getElementById('examCardName').textContent = error.message; });
    document.getElementById('examCardPhoto').addEventListener('error', function () { this.style.display = 'none'; });

    fetch('/api/my-fees', { credentials: 'same-origin' }).then(r => r.json()).then(fees => {
      const cleared = Array.isArray(fees) && fees.length > 0 && fees.reduce((balance, fee) => balance + Number(fee.amount_due) - Number(fee.amount_paid), 0) <= 0;
      document.getElementById('examCardFeeStatus').textContent = cleared ? 'Fees cleared' : 'Clear your outstanding fees to download the exam card.';
      if (cleared) document.getElementById('downloadExamCard').style.display = 'inline-block';
    }).catch(() => { document.getElementById('examCardFeeStatus').textContent = 'Fee clearance could not be checked.'; });

    fetch('/api/student/exams', { credentials: 'same-origin' })
      .then(r => r.json())
      .then(exams => {
        const wrap = document.getElementById('examsList');
        if (!Array.isArray(exams)) throw new Error(exams.error || 'Upload your passport photo from the dashboard to activate exam access.');
        if (!exams.length) {
          wrap.innerHTML = '<p class="empty">No exams available yet. Check back later.</p>';
          return;
        }
        wrap.innerHTML = exams.map(e => {
          let action;
          if (e.submitted_attempt) {
            action = '<div class="btn-done">✅ Completed</div>';
          } else if (e.in_progress) {
            action = '<a href="exam.html?id=' + e.id + '" class="btn-take">Resume Exam →</a>';
          } else {
            action = '<a href="exam.html?id=' + e.id + '" class="btn-take">Take Exam →</a>';
          }
          return `
            <div class="exam-card">
              <div class="exam-info">
                <h3>${escapeHtml(e.title)}</h3>
                <p class="meta">${escapeHtml(e.code || '')} · ${escapeHtml(e.course_title || '')} · ${e.duration_minutes} min · ${e.total_marks} marks</p>
              </div>
              <div class="exam-action">${action}</div>
            </div>
          `;
        }).join('');
      })
      .catch(err => {
        document.getElementById('examsList').innerHTML = '<p class="empty">Could not load exams: ' + err.message + '</p>';
      });

    function escapeHtml(s) {
      return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
  </script>
  <script src="help-widget.js"></script>
</body>
</html>
