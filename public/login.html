<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Herald Portal — Login</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="auth-body">
  <div class="auth-card">
    <h1>🎓 Herald Portal</h1>
    <p class="subtitle">Trainer Consultant Students Portal</p>

    <div class="tabs">
      <button class="tab active" data-tab="login" type="button">Login</button>
      <button class="tab" data-tab="register" type="button">Register</button>
    </div>

    <form id="loginForm" class="auth-form">
      <label>Registration Number</label>
      <input name="reg_no" placeholder="e.g. STU001" required />
      <label>Password</label>
      <input name="password" type="password" required />
      <button type="submit" class="btn-primary">Sign In</button>
      <p class="hint">Demo: <code>STU001</code> / <code>password123</code></p>
    </form>

    <form id="registerForm" class="auth-form hidden">
      <label>Registration Number</label>
      <input name="reg_no" required />
      <label>Full Name</label>
      <input name="name" required />
      <label>Email</label>
      <input name="email" type="email" required />
      <label>Course</label>
      <input name="course" required />
      <label>Password</label>
      <input name="password" type="password" minlength="6" required />
      <button type="submit" class="btn-primary">Create Account</button>
    </form>

    <p id="authMsg" class="msg"></p>

    <p class="hint" style="margin-top:16px; border-top:1px solid var(--border); padding-top:16px;">
      Are you a trainer? <a href="admin-login.html">🛡️ Admin login →</a>
    </p>
  </div>
  <script src="app.js"></script>
</body>
</html>
