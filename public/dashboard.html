<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Herald Portal — Dashboard</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="style.css" />
  <script>
    (function () {
      try {
        if (localStorage.getItem('theme') === 'dark') {
          document.documentElement.classList.add('dark-preload');
        }
      } catch (e) {}
    })();
  </script>
  <style>.dark-preload body { background: #0f172a; }</style>
</head>
<body>
  <header class="topbar">
    <div class="brand">🎓 Herald Portal</div>
    <div class="user-box">
      <span id="userName">…</span>
      <button class="theme-toggle" id="themeToggle" title="Toggle dark mode" type="button">🌓</button>
      <button id="logoutBtn" class="btn-ghost" type="button">Logout</button>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <h2>Welcome back, <span id="welcomeName"></span> 👋</h2>
      <p>Reg No: <strong id="regNo"></strong> • <span id="studentCourse"></span></p>
    </section>

    <div class="grid">
      <section class="card">
        <h3>📢 Announcements</h3>
        <ul id="announcements" class="list"></ul>
      </section>

      <section class="card">
        <h3>💰 My Fees</h3>
        <div id="feesSummary" class="fees-summary"></div>
        <ul id="feesList" class="list"></ul>
      </section>

      <section class="card">
        <h3>📚 Available Courses</h3>
        <ul id="courses" class="list"></ul>
      </section>

      <section class="card">
        <h3>📅 My Timetable</h3>
        <ul id="timetable" class="list"></ul>
      </section>

      <section class="card wide">
        <h3>📊 My Results</h3>
        <div class="table-wrap">
          <table id="resultsTable">
            <thead>
              <tr><th>Code</th><th>Course</th><th>Term</th><th>Marks</th><th>Grade</th></tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>

      <section class="card wide">
        <h3>📝 My Assignments</h3>
        <ul id="assignments" class="list"></ul>
      </section>
    </div>
  </main>

  <div id="toastWrap" class="toast-wrap"></div>
  <script src="app.js"></script>
</body>
</html>
