<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Admin Access — Herald Portal</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
  .auth-body {
  position: relative;
  overflow: hidden;
  background: #3d1a1a;
}

.auth-body .auth-photo-bg {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background-image: url('images/hero-admin.jpg');
  background-size: cover;
  background-position: center;
  z-index: 0;
  pointer-events: none;
}

.auth-body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: linear-gradient(135deg, rgba(61, 26, 26, 0.80) 0%, rgba(61, 26, 26, 0.55) 100%);
  z-index: 1;
  pointer-events: none;
}

.auth-card {
  position: relative;
  z-index: 2;
}
  .auth-video-bg {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    object-fit: cover;
    z-index: 0;
    pointer-events: none;
  }
  .auth-body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: rgba(61, 26, 26, 0.75); /* admin tint */
    z-index: 1;
  }
  .auth-card {
    position: relative;
    z-index: 2;
  }
  .login-logo {
    display: block;
    max-width: 180px;
    margin: 0 auto 8px;
  }
</style>
</head>
<body class="auth-body admin-auth">
  <div class="auth-photo-bg"></div>
  <video
  class="auth-video-bg"
  autoplay
  muted
  loop
  playsinline
  poster="images/login-background.png"
>
  <source src="videos/herald-promo.mp4" type="video/mp4" />
</video>
  <div class="auth-card">
    <img src="images/herald-logo.png" alt="Herald Trainer and Consultant" class="login-logo" />
    <h1>Administrator</h1>
    <p class="subtitle">Staff Access Only</p>

    <form id="adminLoginForm" class="auth-form">
      <label for="admin-user">Username</label>
      <input id="admin-user" name="username" placeholder="admin" required autofocus />
      <label for="admin-pwd">Password</label>
      <input id="admin-pwd" name="password" type="password" required />
      <button type="submit" class="btn-primary">Sign In</button>
    </form>

    <p id="adminMsg" class="msg"></p>

    <p class="hint" style="margin-top:20px; border-top:1px solid var(--border-soft); padding-top:20px;">
      <a href="login.html">Return to student portal</a>
    </p>
  </div>
  <script src="admin-app.js"></script>
  <script src="home-button.js"></script>
</body>
</html>
