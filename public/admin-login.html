<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Herald Admin — Login</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="auth-body admin-auth">
  <div class="auth-card">
    <h1>🛡️ Herald Admin</h1>
    <p class="subtitle">Trainer / Consultant Panel</p>
    <form id="adminLoginForm" class="auth-form">
      <label>Username</label>
      <input name="username" placeholder="admin" required autofocus />
      <label>Password</label>
      <input name="password" type="password" required />
      <button type="submit" class="btn-primary">Sign In</button>
      <p class="hint">Demo: <code>admin</code> / <code>admin123</code></p>
    </form>
    <p id="adminMsg" class="msg"></p>
    <p class="hint" style="margin-top:16px;"><a href="login.html">← Student login</a></p>
  </div>
  <script src="admin-app.js"></script>
</body>
</html>
