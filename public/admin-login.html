<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Access — Herald Portal</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .auth-body {
      background-image: url('images/login-background.png');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      position: relative;
    }
    .auth-body::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(61, 26, 26, 0.65);
      backdrop-filter: blur(3px);
    }
    .auth-card {
      position: relative;
      z-index: 2;
    }
    .login-logo {
      display: block;
      max-width: 180px;
      margin: 0 auto 8px;
    }
  </style>
</head>
<body class="auth-body admin-auth">
  <div class="auth-card">
    <img src="images/herald-logo.png" alt="Herald Trainer and Consultant" class="login-logo" />
    <h1>Administrator</h1>
    <p class="subtitle">Staff Access Only</p>

    <form id="adminLoginForm" class="auth-form">
      <label for="admin-user">Username</label>
      <input id="admin-user" name="username" placeholder="admin" required autofocus />
      <label for="admin-pwd">Password</label>
      <input id="admin-pwd" name="password" type="password" required />
      <button type="submit" class="btn-primary">Sign In</button>
    </form>

    <p id="adminMsg" class="msg"></p>

    <p class="hint" style="margin-top:20px; border-top:1px solid var(--border-soft); padding-top:20px;">
      <a href="login.html">Return to student portal</a>
    </p>
  </div>
  <script src="admin-app.js"></script>
</body>
</html>
